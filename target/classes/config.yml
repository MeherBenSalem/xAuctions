# ═══════════════════════════════════════════════════════════════
#                xAuctions - Configuration
# ═══════════════════════════════════════════════════════════════

# ---------------------------------------------------------------
# General Settings
# ---------------------------------------------------------------
general:
  # Enable debug mode to see detailed logs in the console.
  # Useful for troubleshooting issues.
  debug: false

# ---------------------------------------------------------------
# Economy Settings
# ---------------------------------------------------------------
economy:
  # The economy provider to use.
  # Available options: vault, playerpoints
  provider: vault

# ---------------------------------------------------------------
# Storage Settings
# ---------------------------------------------------------------
storage:
  # Storage type for auction data.
  # Available options: json, mysql, mariadb, postgresql, sqlite
  type: json

  # Database connection settings (only used if type is not json)
  connection:
    host: localhost
    port: 3306
    database: xauctions
    username: root
    password: password
    
    # Prefix for database tables
    table-prefix: xa_
    
    # Maximum pool size for connection pooling
    max-pool-size: 10

# ---------------------------------------------------------------
# Auction Settings
# ---------------------------------------------------------------
auction-settings:
  # Default duration for an auction in seconds.
  # 86400 seconds = 24 hours
  default-duration: 86400

  # Fee charged to list an item (currency based on economy provider).
  # Set to 0 to disable listing fees.
  listing-fee: 10.0

  # Maximum number of concurrent auctions a player can have listed.
  # Bypass permission: xauctions.limit.bypass
  max-auctions: 15

  # Minimum start price for an auction.
  min-price: 10.0

  # Maximum allowable price for an auction.
  max-price: 1000000000.0

  # Allow players in Creative mode to list items?
  # Recommended: false (to prevent economy exploits)
  allow-creative: false

  # Allow damaged items to be listed?
  allow-damaged: true

  # Broadcast messages to the server?
  broadcast-creation: true
  broadcast-sale: true

# ---------------------------------------------------------------
# Integrations
# ---------------------------------------------------------------
integrations:
  discord:
    # Webhook URL for sending auction alerts to a Discord channel.
    # Leave empty to disable Discord integration.
    webhook-url: ""
