# ═══════════════════════════════════════════════════════════════
#                xAuctions - Configuration
# ═══════════════════════════════════════════════════════════════

# ---------------------------------------------------------------
# General Settings
# ---------------------------------------------------------------
general:
  # Enable debug mode to see detailed logs in the console.
  # Useful for troubleshooting issues.
  debug: false

# ---------------------------------------------------------------
# Economy Settings
# ---------------------------------------------------------------
economy:
  # The economy provider to use.
  # Available options: vault, playerpoints, donutcore
  # Selecting "donutcore" will use the native DonutCore economy service when
  # available, falling back to Vault otherwise. If using Vault you can also
  # leave this set to "vault" and the plugin will detect DonutCore via Vault
  # automatically.
  provider: vault

# ---------------------------------------------------------------
# Storage Settings
# ---------------------------------------------------------------
storage:
  # Storage type for auction data.
  # Available options: json, mysql, mariadb, postgresql, sqlite
  type: json

  connection:
    host: localhost
    port: 3306
    database: xauctions
    username: root
    password: password
    table-prefix: xa_
    max-pool-size: 10

auction-settings:

  default-duration: 86400

  listing-fee: 10.0
  # Bypass permission: xauctions.limit.bypass
  max-auctions: 15

  # Minimum start price for an auction.
  min-price: 10.0

  # Maximum allowable price for an auction.
  max-price: 1000000000.0

  allow-creative: false

  # Allow damaged items to be listed?
  allow-damaged: true

  # Broadcast messages to the server?
  broadcast-creation: true
  broadcast-sale: true

integrations:
  discord:
    # Leave empty to disable Discord integration.
    webhook-url: ""

# Command settings
commands:
  # If true, the top-level `/sell` command will be enabled.
  # Default: false — prefer `/ah sell <price>` as the canonical usage.
  enable-top-level-sell: false

# ---------------------------------------------------------------
# Update checker (Modrinth)
# ---------------------------------------------------------------
update-checker:
  enabled: true
  notify-console: true
